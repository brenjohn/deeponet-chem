[optuna]
study_name = "deeponet_chem_hpo"
direction  = "minimize"
n_trials   = 56
storage    = "sqlite:///optuna_study.db"

[paths]
data_dir      = "./data/"
metadata_file = "metadata.json"
train_data    = "train_dataset.npy"
valid_data    = "valid_dataset.npy"

[model]
output_size = 14
input_size  = 21

[training]
num_epochs = 2
validators    = ['OneStep']
primary_loss  = 'one_step_loss'

[search_space]
activation    = { type = "categorical", choices = ["tanh", "gelu", "silu"] }
latent_size   = { type = "categorical", choices = [32, 64, 128] }
branch_size   = { type = "categorical", choices = [32, 64, 128, 256] }
trunk_size    = { type = "categorical", choices = [32, 64, 128] }
branch_layers = { type = "int", low = 2, high = 4 }
trunk_layers  = { type = "int", low = 2, high = 4 }
batch_size    = { type = "categorical", choices = [64, 128, 256] }
learning_rate = { type = "float", low = 1e-5, high = 5e-3, log = true }
weight_decay  = { type = "float", low = 1e-6, high = 1e-2, log = true }