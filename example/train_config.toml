[paths]
data_dir         = "./data/"
metadata_file    = "metadata.json"
train_data       = "train_dataset.npy"
valid_data       = "valid_dataset.npy"
model_checkpoint = "best_model.pth"

[model]
output_size   = 14
input_size    = 21
latent_size   = 35
branch_size   = 70 
branch_layers = 4
trunk_size    = 70 
trunk_layers  = 4

[training]
learning_rate = 1e-6
weight_decay  = 0.0
batch_size    = 64
num_epochs    = 210