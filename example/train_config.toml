[paths]
data_dir      = "./data/"
metadata_file = "metadata.json"
train_data    = "train_dataset.npy"
valid_data    = "valid_dataset.npy"
checkpoints   = "best_model.pth"

[model]
output_size   = 14
input_size    = 21
latent_size   = 128
branch_size   = 256 
branch_layers = 3
trunk_size    = 128 
trunk_layers  = 2
activation    = 'silu'

[training]
learning_rate = 3.5e-5
weight_decay  = 1.12e-6
batch_size    = 64
num_epochs    = 350
validators    = ['OneStep', 'Rollout']
primary_loss  = 'one_step_loss'