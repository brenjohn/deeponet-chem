[optuna]
study_name = "deeponet_chem_hpo"
direction  = "minimize"
num_trials = 2
storage    = "./optuna_journal.log"

[paths]
data_dir      = "./data/"
metadata_file = "metadata.json"
train_data    = "train_dataset.npy"
valid_data    = "valid_dataset.npy"

[model]
output_size       = 14
branch_input_size = 14
trunk_input_size  = 7

[training]
variant       = 'fixed_step'
num_epochs    = 2
validators    = ['Rollout']
primary_loss  = 'rollout_average_loss'

[search_space]
activation    = { type = "categorical", choices = ["tanh", "gelu"] }
latent_size   = { type = "categorical", choices = [8, 16] }
branch_size   = { type = "categorical", choices = [8, 16] }
trunk_size    = { type = "categorical", choices = [8, 16] }
branch_layers = { type = "int", low = 2, high = 3 }
trunk_layers  = { type = "int", low = 2, high = 3 }
batch_size    = { type = "categorical", choices = [64, 128] }
learning_rate = { type = "float", low = 1e-5, high = 5e-3, log = true }
weight_decay  = { type = "float", low = 1e-6, high = 1e-2, log = true }